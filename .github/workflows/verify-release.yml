name: Verify Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  verify-windows-asset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download stable Desktop asset
        run: gh release download "$RELEASE_TAG" --pattern FUNG-windows-x64-setup.exe --dir download
      - name: Verify SHA-256
        working-directory: download
        run: sha256sum --check "../manifests/$RELEASE_TAG.sha256"
